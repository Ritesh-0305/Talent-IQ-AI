server:
  port: ${PORT:8088}
  servlet:
    context-path: /

spring:
  application:
    name: talentiq-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}          # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  storage:
    base-path: ${APP_STORAGE_BASE_PATH:C:/talentiq-uploads}
    max-file-size: 10485760                               # 10 MB
  admin:
    seed-email: ${ADMIN_SEED_EMAIL:admin@talentiq.local}
    seed-password: ${ADMIN_SEED_PASSWORD:Admin@TalentIQ2026}
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    internal-api-key: ${AI_INTERNAL_API_KEY:talentiq-internal-ai-key-secret-2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info
